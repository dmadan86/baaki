# The login sheet offers the provider tiles and the passwordless code path.
#
# The other ways in — Google, Apple, phone — are three icon tiles under an
# "or continue with" seam at the foot of the sheet, each with a one-word
# caption; the passwordless text links ("Forgot password" on the login door,
# "Email me a code" on both) sit under the fields. This asserts they all render
# — it does not tap through a provider (completing either needs a real IdP
# round-trip, which belongs to a manual/device pass) and it does not send a code
# (that hits the mail provider — see login-email-code).
appId: app.waves.mobile
---
- launchApp:
    clearState: true

# /welcome → /sign-in, the white sheet.
- tapOn: 'Sign in'
- assertVisible: 'Email me a code'
- assertVisible: 'Forgot password'
- assertVisible: 'or continue with'
- assertVisible:
    id: 'auth-google'
- assertVisible:
    id: 'auth-apple'
- assertVisible:
    id: 'auth-phone'
