# Local Supabase stack (ADR-002). `supabase start` boots Postgres, Auth,
# Realtime, Storage and the Edge runtime; migrations are owned by Prisma
# (packages/db) and applied against the direct connection, never by `supabase
# db push`.

project_id = "baaki"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Not a feature this app has, and left at the CLI's default it makes every
# `config push` fail with a 402 on a free project.
[storage.vector]
enabled = false

# Receipts live in a private bucket, reachable only through signed URLs
# (ADR-013). The bucket itself is created by a migration in M5.
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "waves://"
# `waves://auth` is what `makeRedirectUri({ scheme: 'waves', path: 'auth' })`
# produces, and Supabase matches these exactly — `waves://` on its own does not
# cover it, so leaving it out sends every OAuth round trip to site_url instead
# and the app never sees the tokens.
#
# `waves` is the app's only registered scheme. The hosted project's Auth
# settings and the Google/Apple consoles have to list `waves://auth` too — a
# console still holding only the pre-rename scheme sends the round trip
# somewhere the app no longer answers.
additional_redirect_urls = ["waves://", "waves://auth", "http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
# ADR-006. A guest opens a link and starts splitting; there is no account until
# they want one. Undeclared, the CLI defaults this to false and `config push`
# closes the front door of the app — which is exactly what it did once.
enable_anonymous_sign_ins = true
# `linkIdentity` is refused outright without this, and that call is the whole of
# ADR-006's in-place upgrade: a guest taps "continue with Google" and keeps the
# trip they have been adding expenses to all week. Off, the app falls back to
# nothing — there is no second way to reach that account.
enable_manual_linking = true
# The client refuses anything shorter (MIN_PASSWORD_LENGTH in @waves/core), and
# a server that would have accepted it is a rule enforced in one place only.
minimum_password_length = 8

[auth.email]
enable_signup = true
# On, and it stays on. Off, an address is trusted the moment somebody types it,
# so anyone can hold an account under a stranger's email — and the invite flow
# means addresses are guessable by design. `config push` sends this file to the
# hosted project, so a local convenience here is a live account takeover.
enable_confirmations = true
# A minute between mails, and eight digits. Both are Supabase's hosted defaults;
# 1s and six digits are what a local stack does not care about and a real one
# does — that is a mailbox flood and a code worth guessing.
max_frequency = "1m0s"
otp_length = 8

# ADR-006: guests join a group from a link with no account at all, so phone is a
# way to keep an account, never the way to get one.
#
# Signup is off because no SMS provider is configured on either stack. Turned on
# without one, Supabase marks Twilio enabled with empty credentials, every code
# fails to send, and the person is left on a screen waiting for an SMS that was
# never posted. Turn both on in the same change that adds the credentials.
[auth.sms]
# Stays off, and the client agrees: `sendOtp` in apps/mobile/src/lib/auth.tsx
# passes `shouldCreateUser: false`, and the phone tile is absent from the
# sign-up door. A number signs a person back in, or attaches to the account a
# guest already has; it never opens a new one.
enable_signup = false
enable_confirmations = true

# Programmable Messaging — not used. Verify below is the provider; this block
# stays present and disabled so nobody wires the cheaper one by accident.
[auth.sms.twilio]
enabled = false

# Twilio Verify — off, and not the plan. Verify mints and checks its own code,
# which cannot work behind the send hook below: the hook exists because GoTrue
# generates the code and hands it to us to deliver, so Verify would put two
# different codes in play and neither would validate. Left here, disabled, so
# nobody reaches for it later without meeting this note first.
[auth.sms.twilio_verify]
enabled = false

# The code travels over WhatsApp, not SMS, and the `otp-send` edge function is
# what sends it. Three reasons, in order of weight:
#
#   1. India is the first market, and A2P SMS there is gated on DLT registration
#      with the operators through TRAI — unregistered traffic is dropped by the
#      carrier, not by Supabase. WhatsApp business messaging is not A2P SMS and
#      carries none of that paperwork.
#   2. A per-number daily cap can only be enforced somewhere the client cannot
#      skip. The app calls GoTrue directly, so a limit written into the app is
#      advice; in the hook it is the only door.
#   3. It is markedly cheaper per message, and the code lands in an app people
#      already have open.
#
# STILL OFF, deliberately. Enabled with the function undeployed or its Twilio
# secrets unset, every send fails and somebody sits on the code screen waiting
# for a message that was never posted. Flip `enabled` in the same change that
# deploys `otp-send` and sets its secrets — never before.
#
# The one signing secret has to be written in *two* places, because two
# different runtimes need it and they are configured by different mechanisms.
# Generate it once (`v1,whsec_<base64>`), then:
#
#   1. The edge function, which verifies the signature. `supabase secrets set`
#      sets Edge Function environment only:
#
#        supabase secrets set SEND_SMS_HOOK_SECRET=v1,whsec_...  \
#                             TWILIO_ACCOUNT_SID=AC...           \
#                             TWILIO_AUTH_TOKEN=...              \
#                             TWILIO_WHATSAPP_FROM=whatsapp:+... \
#                             TWILIO_OTP_CONTENT_SID=HX...
#
#   2. GoTrue, which creates the signature. That is the `env(...)` below, read
#      from `supabase/.env` (gitignored) when this file is pushed — exactly like
#      the Google secret further down. `supabase secrets set` does **not** reach
#      it; a hook configured that way is signed by nobody and refused by us.
#
#        # supabase/.env
#        SEND_SMS_HOOK_SECRETS=v1,whsec_...
#
# Same value in both, or every genuine request is answered 401.
[auth.hook.send_sms]
enabled = false
uri = "https://<project-ref>.supabase.co/functions/v1/otp-send"
secrets = "env(SEND_SMS_HOOK_SECRETS)"

# The client id is not a secret — it travels in every authorize URL and is
# visible to anyone who taps "continue with Google". The secret is, and lives in
# `supabase/.env` (gitignored) so it never reaches the repo or a build.
#
# `supabase config push` sends this file to the hosted project, so everything
# above is live settings, not local ones. Read the whole file before pushing:
# anything this file does not say, the CLI supplies a default for and pushes
# anyway, silently overwriting whatever the dashboard had. The first push here
# turned off anonymous sign-ins, manual identity linking and email confirmation
# in one go — the first two are the guest flow, which is the app.
[auth.external.google]
enabled = true
client_id = "755904924475-vkp5ga0cpt58fr6patnst4e4r02cmhcv.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

# Sign in with Apple. Two audiences share one block:
#   - the native bundle id (`app.waves.mobile`) authorizes the iOS id-token flow
#     (AppleAuthentication.signInAsync -> supabase.auth.signInWithIdToken),
#   - the Services ID authorizes the browser-redirect fallback used on Android
#     and web (signInWithOAuth via `oauthThroughBrowser`).
# `secret` is the ES256 client-secret JWT signed with the Sign in with Apple key
# (.p8); regenerate it before it expires (max 6 months). Replace <services-id>
# with the real Services ID once created in the Apple Developer portal.
[auth.external.apple]
enabled = true
client_id = "app.waves.mobile,<services-id>"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Every function verifies a Supabase JWT unless it is named here, and these two
# are the only callers that cannot hold one:
#
#   * `email-events` is Resend reporting what happened to a message. It has no
#     Supabase account. What it has is a Svix signature over the exact bytes of
#     the body, checked before the body is read, and that check is the whole of
#     the endpoint's security.
#   * `email-unsubscribe` is a mail client pressing the button Gmail puts beside
#     the sender's name (RFC 8058) — unattended, with no session, on behalf of
#     somebody who may not have the app. The signed address stands in for one.
#   * `otp-send` is GoTrue handing over a sign-in code to deliver. The caller is
#     the auth server itself, before any session exists — by definition there is
#     no JWT to check. A standardwebhooks signature over the exact bytes stands
#     in for one, verified before the body is parsed.
#
# Left at the default of true, all three answer 401: delivery reports stop
# arriving, nobody can get off the list, and no sign-in code is ever sent. None
# of those failures says anything out loud.
[functions.email-events]
verify_jwt = false

[functions.email-unsubscribe]
verify_jwt = false

[functions.otp-send]
verify_jwt = false

[analytics]
enabled = false
