name: Vercel deploy (manual)

# Vercel's git integration is turned off (git.deploymentEnabled: false in each
# project's vercel.json), so no push or PR ever creates a deployment. This workflow
# is the only way a deploy happens: run it by hand from the Actions tab, pick
# the project (web / admin / website / all) and the target (preview / production).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN              — a Vercel access token
#   VERCEL_ORG_ID             — the Vercel team/org id (same for every project)
#   VERCEL_PROJECT_ID_WEB     — project id of waves-web     (.vercel/project.json)
#   VERCEL_PROJECT_ID_ADMIN   — project id of waves-admin   (.vercel/project.json)
#   VERCEL_PROJECT_ID_WEBSITE — project id of waves         (.vercel/project.json)

on:
  workflow_dispatch:
    inputs:
      project:
        description: Which app to deploy
        type: choice
        default: all
        options:
          - web
          - admin
          - website
          - all
      target:
        description: Deployment environment
        type: choice
        default: preview
        options:
          - preview
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.project }}-${{ github.event.inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy ${{ matrix.app }} (${{ github.event.inputs.target }})
    runs-on: ubuntu-latest
    strategy:
      # One deploy per selected app. `all` fans out to every project; naming a
      # single app filters the matrix down to just that entry. fail-fast off so
      # one failing project does not cancel the others.
      fail-fast: false
      matrix:
        app: [web, admin, website]
        exclude:
          - app: ${{ (github.event.inputs.project == 'admin' || github.event.inputs.project == 'website') && 'web' || 'nothing' }}
          - app: ${{ (github.event.inputs.project == 'web' || github.event.inputs.project == 'website') && 'admin' || 'nothing' }}
          - app: ${{ (github.event.inputs.project == 'web' || github.event.inputs.project == 'admin') && 'website' || 'nothing' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ matrix.app == 'admin' && secrets.VERCEL_PROJECT_ID_ADMIN || matrix.app == 'website' && secrets.VERCEL_PROJECT_ID_WEBSITE || secrets.VERCEL_PROJECT_ID_WEB }}
      # The marketing site sits at the repo root, the two apps under apps/.
      APP_DIR: ${{ matrix.app == 'website' && 'website' || format('apps/{0}', matrix.app) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install the Vercel CLI
        run: npm i -g vercel@latest

      # vercel pull reads VERCEL_ORG_ID / VERCEL_PROJECT_ID from the env above to
      # fetch that project's settings. --prod when deploying to production so the
      # right environment variables are pulled and built.
      - name: Pull Vercel project settings
        working-directory: ${{ env.APP_DIR }}
        run: vercel pull --yes --environment=${{ github.event.inputs.target == 'production' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: vercel build ${{ github.event.inputs.target == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (prebuilt)
        working-directory: ${{ env.APP_DIR }}
        run: vercel deploy --prebuilt ${{ github.event.inputs.target == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
