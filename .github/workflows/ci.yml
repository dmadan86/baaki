name: CI

# ADR-014: merges are blocked on all four suites. A money app with offline sync
# has two catastrophic failure modes — wrong balances and lost data — and both
# are testable, so they are tested on every push.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baaki?schema=public
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/baaki?schema=public
  SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baaki_shadow?schema=public

jobs:
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Seven empty files called things like `(value.length` and `b.currency`
      # sat in the repo root for five milestones. They came from shell quoting
      # that ran a fragment of TypeScript as a redirection, and `git add -A`
      # swept them in. Nothing type-checks a filename, so nothing complained.
      - name: No files from a mis-quoted shell command
        run: bash scripts/check-filenames.sh
      # The edge functions import a bundled copy of @baaki/core; build it first
      # so a broken bundle fails here rather than at deploy time.
      - run: pnpm edge:build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  money:
    name: money property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Shares sum to the total, balances sum to zero, simplification preserves
      # every net position, FX is reproducible.
      - run: pnpm test:core

  app:
    name: what the app tells people
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pure modules behind the screens — the activity feed's wording, and
      # anything else that decides what a person is told about their money.
      # Rendering is covered by the Maestro flows in e2e/, not here.
      - run: pnpm test:app
      # The browser client: turning wire strings into balances. A Number
      # slipping in here produces figures that look right and quietly differ
      # from the app's.
      - run: pnpm test:api
      # What a crash report is allowed to say. This one starts the real SDK and
      # reads the envelope, so a beforeSend wired to the wrong option fails here
      # and nowhere else.
      - run: pnpm test:web

  database:
    name: migrations, RLS policies and ledger invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baaki
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Every migration must apply cleanly to an empty database — including the
      # hand-written RLS / trigger / derived-balance SQL.
      - name: Apply migrations to a fresh database
        run: pnpm db:migrate

      # Guards schema.prisma against the applied migrations (TDR §2.0).
      #
      # Diffed against the database the step above just built, not replayed
      # into a shadow database. The replay cannot work: `_prisma_migrations` is
      # created by Prisma outside any migration, and the security hardening
      # migration revokes privileges on it — which fails against a shadow
      # database where that table does not exist. Diffing the migrated database
      # asks the same question and is the one CI can answer.
      - name: Prisma drift check
        run: pnpm db:drift

      # RLS allow/deny matrix + the money invariants, against real Postgres.
      # TEST_DATABASE_URL is named separately from DATABASE_URL on purpose: this
      # suite creates, mutates and deletes rows freely, so it must never inherit
      # whichever project a developer is currently pointed at (packages/db/test/helpers.ts).
      - name: Policy and invariant tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baaki
        run: pnpm test:db

  web-e2e:
    name: web e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The one browser these smoke tests drive. --with-deps pulls the system
      # libraries a headless Chromium needs on a bare runner.
      - name: Install Chromium
        run: pnpm --filter @baaki/web exec playwright install --with-deps chromium
      # The suite boots its own dev server (playwright.config.ts) with placeholder
      # Supabase env — the unauthenticated surface it drives makes no network call.
      - name: Playwright
        run: pnpm --filter @baaki/web e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  security:
    name: secret + dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history so the secret scan sees every commit, not just the tip —
        # a key added and "removed" in a later commit still lives in the history.
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Merge-blocking only on CRITICAL production advisories — the ones worth
      # stopping a release for. The tree currently carries several high-severity
      # advisories that live entirely in transitive build tooling (metro's
      # image-size, postcss's nanoid, prisma's effect) with no non-major fix at
      # our level; gating merges on those would wedge every PR for something we
      # cannot patch. High/moderate remediation is the weekly Dependabot PRs'
      # job (.github/dependabot.yml); this gate catches a genuine critical.
      - name: Dependency audit (production, critical)
        run: pnpm audit --prod --audit-level=critical

  e2e:
    name: e2e (Maestro)
    runs-on: ubuntu-latest
    # Enabled once a build profile exists; the flow itself is committed so the
    # happy path is reviewed alongside the code that implements it.
    if: false
    steps:
      - uses: actions/checkout@v4
      - run: echo "maestro test e2e/"
