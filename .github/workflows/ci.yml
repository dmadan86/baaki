name: CI

# ADR-014: merges are blocked on every suite below. A money app with offline
# sync has two catastrophic failure modes — wrong balances and lost data — and
# both are testable, so they are tested on every push. The app suites are split
# one-per-app (mobile / web / api-client) so a red check names the app that broke.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baaki?schema=public
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/baaki?schema=public
  SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/baaki_shadow?schema=public

jobs:
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Seven empty files called things like `(value.length` and `b.currency`
      # sat in the repo root for five milestones. They came from shell quoting
      # that ran a fragment of TypeScript as a redirection, and `git add -A`
      # swept them in. Nothing type-checks a filename, so nothing complained.
      - name: No files from a mis-quoted shell command
        run: bash scripts/check-filenames.sh
      # A SECURITY DEFINER function runs with the owner's rights and bypasses
      # RLS, yet Supabase + Postgres grant EXECUTE on it to anon and PUBLIC by
      # default. Every new one must state its caller model (a GRANT/REVOKE in the
      # same migration) so an over-grant to the unauthenticated key fails here,
      # not in production (audit 20260825240000).
      - name: SECURITY DEFINER functions declare their caller model
        run: node scripts/check-definer-grants.mjs
      # The edge functions import a bundled copy of @waves/core; build it first
      # so a broken bundle fails here rather than at deploy time.
      - run: pnpm edge:build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  money:
    name: money property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Shares sum to the total, balances sum to zero, simplification preserves
      # every net position, FX is reproducible.
      - run: pnpm test:core

  edge:
    name: edge function tests
    runs-on: ubuntu-latest
    # This job only reads the repo and runs tests — it never writes back, so it
    # takes a read-only token and drops the checkout credentials rather than
    # leaving a write-capable GITHUB_TOKEN in the Git config for later steps.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Supabase edge functions (Deno source) had no unit coverage. These
      # tests run each targeted handler as a pure function over injected
      # dependencies, on Node via vitest — auth parsing (401/403), malformed-body
      # handling, CORS, and r2-sign's reserve/commit/release lifecycle. A Deno
      # shim and stubs for the `npm:` specifiers live in
      # supabase/functions/_shared/test (see supabase/functions/vitest.config.ts).
      - run: pnpm test:edge

  # Each app (and the browser client it shares) is its own test job, so a
  # failure names the app that broke and one app's suite never hides another's.
  # All run on every push regardless of which files changed: a change in a shared
  # package (packages/core, @waves/api-client) can break an app whose own files
  # were untouched, so ADR-014's "all suites block a merge" stays true.
  mobile:
    name: mobile app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pure modules behind the screens — the activity feed's wording, and
      # anything else that decides what a person is told about their money.
      # Rendering is covered by the Maestro flows in e2e/, not here.
      - run: pnpm test:app

  web:
    name: web app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # What a crash report is allowed to say. This one starts the real SDK and
      # reads the envelope, so a beforeSend wired to the wrong option fails here
      # and nowhere else. (The browser E2E is the separate web-e2e job.)
      - run: pnpm test:web

  api-client:
    name: api-client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser client the web app builds on: turning wire strings into
      # balances. A Number slipping in here produces figures that look right and
      # quietly differ from the app's.
      - run: pnpm test:api

  # The database + scenario jobs moved to their own workflow (.github/workflows/
  # db.yml): they exercise only SQL and the @waves/core split maths, so they run
  # only when the migrations, the DB tests, or @waves/core change — never on a
  # UI-only push.

  web-e2e:
    name: web e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The one browser these smoke tests drive. --with-deps pulls the system
      # libraries a headless Chromium needs on a bare runner.
      - name: Install Chromium
        run: pnpm --filter @waves/web exec playwright install --with-deps chromium
      # The suite boots its own dev server (playwright.config.ts) with placeholder
      # Supabase env — the unauthenticated surface it drives makes no network call.
      - name: Playwright
        run: pnpm --filter @waves/web e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  security:
    name: secret + dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Full history so the secret scan sees every commit, not just the tip —
        # a key added and "removed" in a later commit still lives in the history.
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Merge-blocking only on CRITICAL production advisories — the ones worth
      # stopping a release for. The tree currently carries several high-severity
      # advisories that live entirely in transitive build tooling (metro's
      # image-size, postcss's nanoid, prisma's effect) with no non-major fix at
      # our level; gating merges on those would wedge every PR for something we
      # cannot patch. High/moderate remediation is the weekly Dependabot PRs'
      # job (.github/dependabot.yml); this gate catches a genuine critical.
      - name: Dependency audit (production, critical)
        run: pnpm audit --prod --audit-level=critical

  e2e:
    name: e2e (Maestro)
    runs-on: ubuntu-latest
    # Real mobile E2E: seed a known account, build the app against a staging
    # project, boot an emulator, drive the flows in e2e/. It is gated on the
    # repo variable E2E_ENABLED so it stays a clean skip (not a red X) until the
    # prerequisites are provisioned — see e2e/README-e2e.md. Prerequisites:
    #   • repo VARIABLE  E2E_ENABLED = true
    #   • repo SECRETS   E2E_SUPABASE_URL, E2E_SUPABASE_ANON_KEY, E2E_SERVICE_KEY,
    #                    E2E_EMAIL, E2E_PASSWORD, and GOOGLE_SERVICES_JSON_B64
    #                    (android/app/google-services.json for app.waves.mobile,
    #                    base64) — the Waves build profile the old stub waited on.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile

      # Seed the deterministic fixture the flows assert (Goa trip, Beach shack
      # dinner, the ghost Priya) into the staging project.
      - name: Seed the E2E backend
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SERVICE_KEY: ${{ secrets.E2E_SERVICE_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: node e2e/seed-e2e.mjs

      # Build the app against the SAME staging project. The public keys are baked
      # at bundle time from the env below; app.config reads them via .env.
      - name: Point the build at staging
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' \
            "${{ secrets.E2E_SUPABASE_URL }}" "${{ secrets.E2E_SUPABASE_ANON_KEY }}" \
            > apps/mobile/.env
      # Prebuild regenerates android/ from app config; --clean wipes it, so the
      # Firebase file must land AFTER prebuild and before the Gradle build.
      - name: Prebuild the Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean
      - name: Restore Waves google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d \
            > apps/mobile/android/app/google-services.json
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon

      # Boot an emulator, install Maestro, install the APK, run the flows.
      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SERVICE_KEY: ${{ secrets.E2E_SERVICE_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # A single line: android-emulator-runner parses `script` line-by-line,
          # so the loop + reseed logic lives in a committed shell script that
          # runs as one command. See e2e/run-maestro.sh.
          script: bash e2e/run-maestro.sh
      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            ~/.maestro/tests/**
          if-no-files-found: ignore
