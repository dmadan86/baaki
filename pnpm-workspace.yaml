packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'
  - 'website'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  unrs-resolver: true
  prisma: true
  # Fetches the sentry-cli binary on install. Without it there is no source-map
  # upload, so every stack trace arrives minified and a crash report points at
  # column 4210 of one line.
  '@sentry/cli': true
  # Three postinstalls that arrived with the docs site (apps/docs) and are
  # declined rather than left undecided, because an undeclared ignored build
  # fails `pnpm install` outright.
  #
  # @parcel/watcher only speeds up `docusaurus start`'s file watching and falls
  # back to polling; core-js's postinstall prints a funding notice; and
  # postman-code-generators compiles per-language snippet generators for the
  # OpenAPI theme's "try it" panel, which is turned off (hideSendButton).
  '@parcel/watcher': false
  core-js: false
  postman-code-generators: false
  # Two more that arrived with @react-native-firebase, declined for the same
  # reason: phone sign-in runs against the *native* Firebase SDKs, so neither
  # JavaScript postinstall is on any path this app takes. @firebase/util's
  # generates an ESM/CJS shim for the web SDK; protobufjs's compiles its
  # reflection types for code generation nothing here does.
  '@firebase/util': false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.12 || 57.0.13 || 57.0.14'
  - '@expo/router-server@57.0.5'
  - '@expo/ui@57.0.9 || 57.0.10'
  - expo-constants@57.0.9 || 57.0.10
  - expo-image@57.0.2
  - expo-linking@57.0.5
  - expo-modules-core@57.0.9 || 57.0.10
  - expo-router@57.0.10 || 57.0.11 || 57.0.12
  - expo@57.0.10 || 57.0.11 || 57.0.12
  - '@expo/config-plugins@57.0.7'
  - babel-preset-expo@57.0.6
  - expo-asset@57.0.9 || 57.0.10
  - expo-file-system@57.0.2
  - expo-image-picker@57.0.8 || 57.0.9
  - expo-notifications@57.0.9 || 57.0.10
  - expo-symbols@57.0.2
  - expo-image-manipulator@57.0.8 || 57.0.9
  - '@expo/fingerprint@0.20.7'
  - '@expo/inline-modules@0.1.5'
  - '@expo/local-build-cache-provider@57.0.6'
  - '@expo/metro-config@57.0.8'
  - '@expo/prebuild-config@57.0.11'
  - expo-server@57.0.2
  - '@expo/metro-runtime@57.0.9'
  - expo-dev-client@57.0.11
  - expo-dev-launcher@57.0.11
  - expo-dev-menu@57.0.11
  - expo-splash-screen@57.0.6
  - expo-updates@57.0.13

# expo-asset pulls its own expo-constants, so pnpm installs two copies. A
# native build may only contain one version of a native module, and
# `expo doctor` fails on the duplicate. Pinning collapses both to one.
#
# Keep this in step with `apps/mobile/package.json` and with what the SDK
# expects. It sat at 57.0.9 while the app asked for 57.0.17, and because
# `node-linker=hoisted` flattens the tree to a single copy, the override won and
# the app's own pin was silently ignored — which `expo doctor` then reported as
# a version mismatch the app's package.json appeared to have already fixed.
overrides:
  expo-constants: 57.0.18

# Expo loads a package's config plugin from inside that package, and several of
# them require `@expo/config-plugins` without declaring it — it is always
# present under npm's flat layout, so nobody notices. Under pnpm's strict one
# the Android build dies in `expo-constants:createExpoConfig` with "Cannot find
# module '@expo/config-plugins'", naming a file nobody in this repo wrote.
# Declaring the dependency on the package's behalf is narrower than hoisting.
packageExtensions:
  react-native-document-scanner-plugin:
    dependencies:
      '@expo/config-plugins': '^57.0.7'

patchedDependencies:
  react-native-get-sms-android@2.1.0: patches/react-native-get-sms-android@2.1.0.patch
