packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  unrs-resolver: true
  prisma: true
  # Fetches the sentry-cli binary on install. Without it there is no source-map
  # upload, so every stack trace arrives minified and a crash report points at
  # column 4210 of one line.
  '@sentry/cli': true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.12 || 57.0.13'
  - '@expo/router-server@57.0.5'
  - '@expo/ui@57.0.9'
  - expo-constants@57.0.9
  - expo-image@57.0.2
  - expo-linking@57.0.5
  - expo-modules-core@57.0.9 || 57.0.10
  - expo-router@57.0.10 || 57.0.11
  - expo@57.0.10 || 57.0.11
  - '@expo/config-plugins@57.0.7'
  - babel-preset-expo@57.0.6
  - expo-asset@57.0.9
  - expo-file-system@57.0.2
  - expo-image-picker@57.0.8
  - expo-notifications@57.0.9
  - expo-symbols@57.0.2
  - expo-image-manipulator@57.0.8

# expo-asset pulls its own expo-constants, so pnpm installs two copies. A
# native build may only contain one version of a native module, and
# `expo doctor` fails on the duplicate. Pinning collapses both to the version
# the app already depends on.
overrides:
  expo-constants: 57.0.9
