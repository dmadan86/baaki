packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  unrs-resolver: true
  prisma: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.12'
  - '@expo/router-server@57.0.5'
  - '@expo/ui@57.0.9'
  - expo-constants@57.0.9
  - expo-image@57.0.2
  - expo-linking@57.0.5
  - expo-modules-core@57.0.9
  - expo-router@57.0.10
  - expo@57.0.10
