// The expo-module-gradle-plugin alone applies com.android.library + Kotlin and
// wires the `release` software component autolinking expects; applying those
// plugins again here breaks that component.
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.waveswatch'
version = '1.0.0'

android {
  namespace 'expo.modules.waveswatch'
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // The Wearable Data Layer — MessageClient / NodeClient / WearableListenerService.
  implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
